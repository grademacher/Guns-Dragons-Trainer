; Guns and Dragons Playtest (Steam app 4991390, EXGameSteam-Win64-Shipping.exe, UE 5.7).
; Fixes UE4SS v4.0.0 crashing at "Locating KismetStringLibrary CDO..." (same crash as UE4SS issue #1482).
; Values were measured read-only in the running game on 2026-11-14. Sections not listed matched the UE4SS
; 5.7 template: UObjectBase, UStruct, UFunction, UScriptStruct, FField, FFieldClass, FUObjectItem,
; FUObjectArray, and TUObjectArray. That covers 111k objects, 6718 classes, 22711 properties, and
; 7674 script structs.

; UClass is 0x268 bytes (template 0x208). 0x60 bytes were inserted after ClassWithin: a function map at 0xE8
; and a lock at 0x138. Everything from NetFields on moved +0x60.
; Checked: ClassDefaultObject at 0x170 for all 8468 classes that have a CDO (Default__KismetStringLibrary
; included). Also checked: FuncMap Num == own function count, Interfaces element[0] is a UClass,
; NativeFunctionLookupTable holds real function names (Actor: 125, ActorHasTag...), and
; ClassConfigName reads "Engine" for Actor.
[UClass]
ClassConstructor = 0xB0
ClassVTableHelperCtorCaller = 0xB8
ClassUnique = 0xC8
FirstOwnedClassRep = 0xCC
bCooked = 0xD0
bLayoutChanging = 0xD1
ClassFlags = 0xD4
ClassCastFlags = 0xD8
ClassWithin = 0xE0
; template 0xE8
ClassConfigName = 0x144
; template 0x100
NetFields = 0x160
; template 0x110
ClassDefaultObject = 0x170
; template 0x118
SparseClassData = 0x178
; template 0x120
SparseClassDataStruct = 0x180
; template 0x128
bNeedsDynamicSubobjectInstancing = 0x188
; template 0x130
FuncMap = 0x190
; template 0x180
FuncMapLock = 0x1E0
; template 0x188
AllFunctionsCache = 0x1E8
; template 0x1D8
AllFunctionsCacheLock = 0x238
; template 0x1E0
Interfaces = 0x240
; template 0x1F0
ReferenceSchema = 0x250
; template 0x1F8
NativeFunctionLookupTable = 0x258
; template 0x208
UEP_TotalSize = 0x268

; FProperty has a new 4-byte field at 0x44. Offset_Internal is at 0x48 (fits PropertiesSize for 22711/22711
; properties; Actor.RootComponent = 0x1B8), and everything after it moved +8.
; PropertyLinkNext at 0x50 points at another property.
[FProperty]
ArrayDim = 0x30
ElementSize = 0x34
PropertyFlags = 0x38
RepIndex = 0x40
; template 0x44
Offset_Internal = 0x48
; template 0x48
PropertyLinkNext = 0x50
; template 0x50
NextRef = 0x58
; template 0x58
DestructorLinkNext = 0x60
; template 0x60
PostConstructLinkNext = 0x68
; template 0x68
RepNotifyFunc = 0x70
; template 0x70
UEP_TotalSize = 0x78

; All FProperty subclasses: +8. Checked against every property of each type (pointer target type
; matches: class, struct, enum, inner property, signature function).
[FMulticastDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FObjectPropertyBase]
PropertyClass = 0x78
UEP_TotalSize = 0x80

[FStructProperty]
Struct = 0x78
UEP_TotalSize = 0x80

[FArrayProperty]
ArrayFlags = 0x78
Inner = 0x80
UEP_TotalSize = 0x88

[FMapProperty]
KeyProp = 0x78
ValueProp = 0x80
MapLayout = 0x88
MapFlags = 0xA0
UEP_TotalSize = 0xA8

; FieldSize/ByteOffset/ByteMask/FieldMask bytes read 01 00 01 01 / 01 00 02 02 at 0x78.
[FBoolProperty]
FieldSize = 0x78
ByteOffset = 0x79
ByteMask = 0x7A
FieldMask = 0x7B
UEP_TotalSize = 0x80

[FByteProperty]
Enum = 0x78
UEP_TotalSize = 0x80

[FEnumProperty]
UnderlyingProp = 0x78
Enum = 0x80
UEP_TotalSize = 0x88

[FClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FSoftClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FInterfaceProperty]
InterfaceClass = 0x78
UEP_TotalSize = 0x80

[FFieldPathProperty]
PropertyClass = 0x78
UEP_TotalSize = 0x80

[FSetProperty]
ElementProp = 0x78
SetLayout = 0x80
UEP_TotalSize = 0x98

; UEnum names are no longer a TArray<TPair<FName,int64>>. This build stores
;   0x40 = pointer (low bit tagged) to FName[Num], 0x48 = pointer to int64 values[Num], 0x50 = int32 Num
; in one allocation: values first, then names. UE4SS can't describe that layout. With Names at the
; template's 0x40, UE4SS would read the tagged pointer and a garbage count and run off the end. Pointing
; Names at 0x48 instead gives a TArray whose pointer is valid and whose Num is right (0x50), and it reads
; Num*16 bytes that stay inside that allocation. Enum NAMES from UE4SS will be wrong in this game, but
; it won't crash. The trainer doesn't use enums.
[UEnum]
CppType = 0x30
Names = 0x48
CppForm = 0x58
EnumFlags = 0x59
EnumPackage = 0x5C
EnumDisplayNameFn = 0x68
UEP_TotalSize = 0x70
